# Tema terang & gelap.
# Ganti tema di dashboard: menu ⋮ (kanan atas) -> Settings -> Choose app theme (Light / Dark / System).
# Panel, KPI, dan grafik buatan sendiri ikut berganti otomatis (lihat app/ui.py).
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F3F6FC"
secondaryBackgroundColor = "#E6ECF7"
textColor = "#1E2A44"

[theme.dark]
primaryColor = "#3BA4FF"
backgroundColor = "#0B1E4A"
secondaryBackgroundColor = "#12306B"
textColor = "#DDE7FF"

[server]
runOnSave = true
